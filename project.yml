name: CWA
options:
  bundleIdPrefix: com.calcifer6737
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  CWA:
    type: application
    platform: iOS
    sources:
      - CWA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calcifer6737.cwa
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CWA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Calibre-Web Automated server on your local network.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  CWA:
    build:
      targets:
        CWA: all
